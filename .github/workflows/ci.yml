name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Generated client is up to date
        if: hashFiles('packages/client/openapi.json') != ''
        run: |
          pnpm gen:client
          git diff --exit-code -- packages/client
      - name: Full check (build + e2e)
        if: hashFiles('apps/mobile/playwright.config.ts') != ''
        run: |
          pnpm --filter @te/mobile exec playwright install --with-deps chromium
          pnpm check:full
      - name: Upload Playwright report
        if: always() && hashFiles('apps/mobile/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results

  # Builds the production image and boots it (PGlite inside, no secrets) so Dockerfile breakage shows up on the PR.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: traitengineer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release command (migrations) runs in the image
        run: docker run --rm -e PGLITE_DIR=/tmp/pglite traitengineer:ci node packages/db/src/cli/migrate.ts
      - name: Boot and smoke test
        run: |
          docker run -d --name te -p 8080:8080 \
            -e NODE_ENV=development -e PGLITE_DIR=/tmp/pglite \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" -e PUBLIC_URL=http://localhost:8080 \
            traitengineer:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/health && break; sleep 2; done
          curl -fsS localhost:8080/health | grep '"db":"ok"'
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          curl -fsS localhost:8080/targets/anything | grep -q '<div id="root">'   # SPA fallback
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp)" = "401"
          curl -fsS localhost:8080/.well-known/oauth-protected-resource/mcp | grep -q '"resource"'
          docker logs te 2>&1 | grep -q "worker started"
      - name: Container logs
        if: always()
        run: docker logs te || true
