name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

# Three jobs in parallel; wall-clock time is the slowest of them. Job names are the status check names
# (`check`, `e2e`, `docker`), so branch protection's required checks must list all three.
jobs:
  # `pnpm check` (typecheck, lint, format, boundaries, unit tests) and the generated-client drift check.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo's local cache, carried between runs: a package's tests are skipped when neither it nor anything it
      # depends on (the `transit` task in turbo.json) changed. Root tasks hash every file, so they always run.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-check-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-
      - run: pnpm check
      - name: Generated client is up to date
        if: hashFiles('packages/client/openapi.json') != ''
        run: |
          pnpm gen:client
          git diff --exit-code -- packages/client
      # Keep the carried-over cache from growing forever: drop entries not written in the last week.
      - name: Prune Turbo cache
        if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # Web build + Playwright against the real API (the second half of `pnpm check:full`).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pnpm --filter @te/mobile exec playwright install --with-deps chromium
      - run: pnpm turbo run e2e
      - name: Upload Playwright report
        if: always() && hashFiles('apps/mobile/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/mobile/playwright-report
            apps/mobile/test-results
      # Keep the carried-over cache from growing forever: drop entries not written in the last week.
      - name: Prune Turbo cache
        if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # Builds the production image and boots it (PGlite inside, no secrets) so Dockerfile breakage shows up on the PR.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: traitengineer:ci
          # PRs read the layer cache that main writes. Only main writes it: exporting took ~2 minutes per run, and
          # PR-scoped caches are never read by other branches anyway.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - name: Release command (migrations) runs in the image
        run: docker run --rm -e PGLITE_DIR=/tmp/pglite traitengineer:ci node packages/db/src/cli/migrate.ts
      - name: Boot and smoke test
        run: |
          docker run -d --name te -p 8080:8080 \
            -e NODE_ENV=development -e PGLITE_DIR=/tmp/pglite \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" -e PUBLIC_URL=http://localhost:8080 \
            traitengineer:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/health && break; sleep 2; done
          curl -fsS localhost:8080/health | grep '"db":"ok"'
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          curl -fsS localhost:8080/targets/anything | grep -q '<div id="root">'   # SPA fallback
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp)" = "401"
          curl -fsS localhost:8080/.well-known/oauth-protected-resource/mcp | grep -q '"resource"'
          docker logs te 2>&1 | grep -q "worker started"
      - name: Container logs
        if: always()
        run: docker logs te || true
