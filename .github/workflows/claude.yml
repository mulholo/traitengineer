name: Claude agent

# Issues labelled `agent` are picked up by Claude Code, which reads AGENTS.md,
# implements the change, runs `pnpm check` and opens a PR.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are working on Trait Engineer. Read AGENTS.md (and the AGENTS.md of every package you touch)
            before changing anything. Implement the issue below, following the definition of done.
            You MUST run `pnpm check` and get it green before opening a pull request.
            Use conventional commits. Do not commit secrets.

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
          claude_args: |
            --allowedTools "Bash(pnpm:*),Bash(git:*),Bash(gh pr:*),Edit,Write,Read,Glob,Grep"
