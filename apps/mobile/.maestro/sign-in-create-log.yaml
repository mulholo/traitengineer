# Sign in → create a change target → log an entry (spec section 9). Uses the same testIDs as the Playwright
# e2e suite. Run against a preview/production build (not the dev client):
#   maestro test -e EMAIL=you@example.com -e PASSWORD=... apps/mobile/.maestro/sign-in-create-log.yaml
# or on EAS with `eas workflow:run .eas/workflows/e2e.yml` (see docs/deploy.md).
appId: ${APP_ID || "com.example.traitengineer"}
name: Sign in, create a target, log evidence
---
- launchApp:
    clearState: true
- tapOn:
    id: "email"
- inputText: ${EMAIL}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn:
    id: "sign-in"
# iOS may offer to save the password (system sheet); decline it so it doesn't cover the app.
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
# First sign-in on a device shows the notifications explainer.
- runFlow:
    when:
      visible: "Gentle reminders"
    commands:
      - tapOn:
          id: "notifications-skip"
- assertVisible: "Today"
- tapOn: "Targets"
- tapOn:
    id: "new-target"
- tapOn:
    id: "field-title"
- inputText: "Default to action (Maestro)"
# Return on a single-line field blurs it and dismisses the keyboard.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "save-target"
- tapOn:
    id: "save-target"
- assertVisible: "Default to action (Maestro)"
- tapOn: "Today"
- tapOn:
    id: "log-button"
    index: 0
# The first field ("What did you do?") is autofocused. Unique text per run so re-runs against the same
# database don't match an older entry.
- evalScript: ${output.note = 'Logged from Maestro ' + Date.now()}
- inputText: ${output.note}
# Return on a single-line field blurs it and dismisses the keyboard.
- pressKey: Enter
- tapOn:
    id: "save-entry"
# Entry cards expose one accessibility label ("Entry: <summary>, <date>"); Maestro text selectors are regexes.
- scrollUntilVisible:
    element: ".*${output.note}.*"
    visibilityPercentage: 50
- assertVisible: ".*${output.note}.*"
