# Fly.io app config. `app` is set at deploy time from FLY_APP (docs/deploy.md); the default matches setup.md.
app = "traitengineer"
primary_region = "lhr"

[build]
dockerfile = "Dockerfile"

[deploy]
# Runs in a temporary machine with the new image before any new machine starts; a failure aborts the deploy.
release_command = "node packages/db/src/cli/migrate.ts"
strategy = "rolling"

[env]
NODE_ENV = "production"
ROLE = "all"
PORT = "8080"
WEB_DIST_DIR = "/app/web"
CLIENT_IP_HEADER = "fly-client-ip"
LOG_LEVEL = "info"

[http_service]
internal_port = 8080
force_https = true
# The pg-boss worker runs in the same process (ROLE=all), so a machine must always be up for reminders.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
type = "requests"
soft_limit = 200
hard_limit = 250

[[http_service.checks]]
grace_period = "20s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "5s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
